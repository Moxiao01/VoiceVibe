# Voice Vibe 语音输入配置
# 使用方法：把本文件复制为 config.toml（同目录），然后填入你的 API Key。

[asr]
# 阿里云百炼（DashScope）API Key，用于实时语音识别（Paraformer 流式）。
# 开通地址：https://bailian.console.aliyun.com/ → API-KEY 管理
api_key = ""
# 流式识别模型（自带中文标点）
model = "paraformer-realtime-v2"
# 服务端过滤语气词（嗯/啊等），与本地规则润色互为补充
disfluency_removal = true

[llm]
# 深度润色（Prompt 化）用的大模型，任意 OpenAI 兼容接口均可。
# 智谱 GLM:  base_url = "https://open.bigmodel.cn/api/paas/v4"            model = "glm-4-flash"
# 通义千问:  base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1" model = "qwen-plus"
# Kimi:     base_url = "https://api.moonshot.cn/v1"                       model = "moonshot-v1-8k"
# OpenAI:   base_url = "https://api.openai.com/v1"                        model = "gpt-4o-mini"
# Ollama:   base_url = "http://localhost:11434/v1"                        model = "qwen2.5:7b"
base_url = "https://open.bigmodel.cn/api/paas/v4"
api_key = ""
model = "glm-4-flash"
temperature = 0.3
timeout = 20

[hotkey]
# 按住说话、松开上屏。三个键对应三种输出模式，Esc 取消本次。
simple = "f2"   # 简单润色（默认推荐）
deep = "f3"     # 深度润色：把口述内容改写成 AI 提示词
raw = "f4"      # 原始转写
cancel = "esc"

[audio]
# 麦克风设备序号，-1 表示系统默认；可用 `python -m sounddevice` 查看设备列表
device = -1
sample_rate = 16000

[polish]
# 简单润色默认为纯规则（瞬时、离线）。
# 打开后会在规则清理之后追加一次 LLM 连贯性处理（需要 llm.api_key，失败自动回退规则结果）。
simple_llm_coherence = false

[ui]
# 悬浮条位置（屏幕坐标），-1 表示默认出现在屏幕底部居中
x = -1
y = -1
